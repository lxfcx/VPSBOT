name: Check Cloudflare credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify secrets and read-only API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account=process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const rows=[];
          const report=(label,ok,detail='')=>{
            const text=(ok?'PASS':'FAIL')+' '+label+(detail?' — '+detail:'');
            console.log(text);rows.push(text);
            if(!ok)process.exitCode=1;
          };
          report('CLOUDFLARE_API_TOKEN is present',!!token);
          report('CLOUDFLARE_ACCOUNT_ID is a 32-character account ID',!!account&&/^[a-f0-9]{32}$/i.test(account));
          async function get(path){
            try{
              const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{
                headers:{Authorization:'Bearer '+token},
                redirect:'error',signal:AbortSignal.timeout(20000)
              });
              const body=await r.json();
              return {ok:r.ok&&body.success===true,status:r.status,body};
            }catch{return {ok:false,status:'network-error',body:{}}}
          }
          if(token){
            let v=await get('user/tokens/verify');
            if(!v.ok&&account&&/^[a-f0-9]{32}$/i.test(account))v=await get('accounts/'+account+'/tokens/verify');
            report('Token is active',v.ok&&v.body.result?.status==='active','HTTP '+v.status);
            if(account&&/^[a-f0-9]{32}$/i.test(account)){
              for(const [label,path] of [['Workers Scripts','workers/scripts'],['D1','d1/database'],['R2','r2/buckets']]){
                const r=await get('accounts/'+account+'/'+path);
                const codes=(r.body.errors||[]).map(e=>e.code).filter(Number.isInteger).join(',');
                report(label+' read access',r.ok,'HTTP '+r.status+(codes?' / code '+codes:''));
              }
            }
          }
          rows.push('Read-only checks do not prove Edit permission. Deployment has not been attempted.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.map(s=>'- '+s).join('\n')+'\n');
          NODE
